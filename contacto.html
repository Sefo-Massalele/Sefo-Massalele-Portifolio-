<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto — Sefo Massalele</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <a href="../index.html" class="logo">Sefo Massalele</a>
    <nav>
      <a href="paginaInicial.html#projetos">Projetos</a>
      <a href="paginaInicial.html#sobre">Sobre</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <div class="contact-wrapper">
    <div class="contact-card">
      <h1>Contacte-nos</h1>

      <form id="contact-form" novalidate>
        <div class="form-field">
          <label for="nome">Nome</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder=" "
            required
            minlength="2"
          />
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder=" "
            required
          />
        </div>

        <div class="form-field">
          <label for="mensagem">Mensagem</label>
          <textarea
            id="mensagem"
            name="mensagem"
            placeholder=" "
            required
            minlength="10"
          ></textarea>
        </div>

        <button type="submit" class="btn-submit">Enviar mensagem</button>
      </form>
    </div>
  </div>
    

</body>
</html>
